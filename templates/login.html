<!DOCTYPE html>
<html>
<head>
    <title>Login Admin</title>
    <style>
        body {
            font-family: Arial;
            background: #f6fbf7;
        }
        .login-box {
            width: 350px;
            margin: 120px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #1b5e20;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
        }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #2ecc71;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="login-box">
    <h2>Login Admin</h2>
    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
